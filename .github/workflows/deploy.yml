name: Deploy to Pre-Production

on:
  push:
    branches: [ "main" ]

jobs:
  # ── Step 1: CI must pass first ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci
      - name: Build Client
        working-directory: ./client
        run: npm run build
        env:
          CI: "false"
          REACT_APP_GEOSERVER_BASE: /geoserver

  # ── Step 2: Deploy only after CI passes ──────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build                  # waits for build job to succeed
    environment: pre-production   # optional: add approval gate in GitHub UI

    steps:
      - name: Deploy to pre-production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     22
          script: |
            set -e

            echo "==> Pulling latest main..."
            cd /srv/urida/current
            git fetch origin
            git pull --ff-only origin main

            echo "==> Installing server dependencies..."
            npm --prefix server install --omit=dev

            echo "==> Building React client..."
            npm --prefix client install --omit=dev
            REACT_APP_GEOSERVER_BASE=/geoserver npm --prefix client run build

            echo "==> Restarting backend..."
            pm2 restart urida-backend --update-env

            echo "==> Health checks..."
            sleep 3
            curl -sf http://localhost:8060/api/test-db > /dev/null && echo "DB OK"
            curl -sf http://localhost:8060/api/home/summary > /dev/null && echo "API OK"

            echo "==> Deploy complete."
            pm2 logs urida-backend --lines 20 --nostream
