name: Deploy to Pre-Production

on:
  push:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client
        working-directory: ./client
        run: npm run build
        env:
          CI: "false"
          REACT_APP_GEOSERVER_BASE: /geoserver

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    environment: pre-production

    steps:
      - name: Deploy to pre-production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     22
          script: |
            set -e

            echo "==> Checking deploy user..."
            whoami
            id
            echo "HOME=$HOME"

            if [ "$(whoami)" != "uridaapp" ]; then
              echo "ERROR: Deployment must run as uridaapp, not $(whoami)"
              exit 1
            fi

            echo "==> Pulling latest main..."
            cd /srv/urida/current
            git fetch origin
            git pull --ff-only origin main

            echo "==> Checking ownership safety..."
            ROOT_COUNT=$(find -L /srv/urida/current -user root | wc -l)
            echo "Root-owned file count: $ROOT_COUNT"

            if [ "$ROOT_COUNT" -ne 0 ]; then
              echo "ERROR: Root-owned files found inside application directory."
              find -L /srv/urida/current -user root -printf "%u:%g %p\n" | head -50
              exit 1
            fi

            echo "==> Runtime versions..."
            node -v
            npm -v

            echo "==> Installing server dependencies..."
            npm --prefix server ci --omit=dev

            echo "==> Installing client dependencies..."
            npm --prefix client ci

            echo "==> Building React client..."
            CI=false REACT_APP_GEOSERVER_BASE=/geoserver npm --prefix client run build

            echo "==> Restarting backend..."
            cd /srv/urida/current/server
            pm2 restart urida-backend --update-env
            pm2 save

            echo "==> Health checks..."
            sleep 3
            curl -sf http://127.0.0.1:8060/api/test-db > /dev/null && echo "DB OK"
            curl -sf http://127.0.0.1:8060/api/home/summary > /dev/null && echo "API OK"
            curl -sf http://127.0.0.1:8060/api/auth/captcha > /dev/null && echo "CAPTCHA OK"

            echo "==> Deploy complete."
            pm2 logs urida-backend --lines 20 --nostream
