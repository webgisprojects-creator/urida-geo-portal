name: Tests

# Runs on pull requests, and is called by the deploy workflow, which waits for it.
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: urida_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres -d urida_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm --prefix server run test:unit

      - name: Integration tests
        run: npm --prefix server run test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: ci-only-password
          DB_NAME: urida_test

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22'

      - name: Server packages (fails on high or critical)
        run: npm audit --omit=dev --workspace server --audit-level=high

      # The client still has high findings inside the react-scripts build tool,
      # which can only be removed by replacing that tool. Fail on anything critical.
      - name: Client packages (fails on critical)
        run: npm audit --omit=dev --workspace client --audit-level=critical
