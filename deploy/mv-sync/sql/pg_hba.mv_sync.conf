# Limit the job's login to one database. pg_read_all_data would otherwise let it read every database.
# Put these lines in pg_hba.conf ABOVE every rule for "all" users, then reload PostgreSQL
# (SELECT pg_reload_conf();). The first matching line wins. Check pg_hba_file_rules.error afterwards.
#
# TYPE  DATABASE     USER          ADDRESS      METHOD
local   nv_allnndb   mv_sync_job                peer
local   all          mv_sync_job                reject
host    all          mv_sync_job   0.0.0.0/0    reject
host    all          mv_sync_job   ::0/0        reject
