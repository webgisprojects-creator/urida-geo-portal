# Reviewable template for the current LB2 shape.
# Do not paste blindly: update upstream IPs/paths for the target migration
# server, confirm AUTH_COOKIE_NAME, then run `nginx -t` before reload.

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    log_format urida_timing '$remote_addr - $host "$request" $status '
                            'rt=$request_time urt=$upstream_response_time '
                            'cache=$upstream_cache_status upstream=$upstream_addr '
                            'bytes=$body_bytes_sent';

    # Edge cache for the app's own stable tile URLs:
    # /api/wms-tile-cache/, /api/gwc-tiles/, /api/tiles/.
    # This is the primary cache path for road/classification traffic.
    proxy_cache_path /var/cache/nginx/urida_app_tiles
        levels=1:2
        keys_zone=urida_app_tile_cache:256m
        max_size=20g
        inactive=2d
        use_temp_path=off;

    # Narrow direct-GeoServer cache for unfiltered GWC and metadata only.
    proxy_cache_path /var/cache/nginx/urida_geoserver
        levels=1:2
        keys_zone=urida_geoserver_cache:128m
        max_size=10g
        inactive=7d
        use_temp_path=off;

    upstream urida_app {
        server 27.100.38.131:8060;
        keepalive 64;
    }

    upstream urida_geoserver {
        server 162.245.218.6:8080 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    map $request_method $skip_cache_method {
        default 1;
        GET 0;
        HEAD 0;
    }

    # The app default is AUTH_COOKIE_NAME=auth_token. If production uses a
    # different AUTH_COOKIE_NAME, change $cookie_auth_token accordingly.
    map "$cookie_auth_token|$http_authorization" $skip_app_tile_cache_auth {
        "|" 1;
        default 0;
    }

    map $http_authorization $skip_geoserver_cache_auth {
        default 1;
        "" 0;
    }

    # Case-insensitive on purpose: GeoServer accepts mixed-case OGC params.
    # Any dynamic style/filter request bypasses the direct GeoServer cache.
    # Filtered road tiles should go through /api/wms-tile-cache/ instead.
    map $request_uri $skip_geoserver_cache_dynamic {
        default 0;
        ~*[?&](sld_body|cql_filter|filter|viewparams|featureid)= 1;
    }

    map "$arg_REQUEST$arg_request" $skip_geoserver_metadata_cache_request {
        default 1;
        ~*getcapabilities 0;
        ~*getlegendgraphic 0;
        ~*describefeaturetype 0;
        ~*describelayer 0;
        ~*getstyles 0;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name 27.100.38.133;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name 27.100.38.133;

        ssl_certificate     /etc/letsencrypt/live/27.100.38.133/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/27.100.38.133/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 500M;

        access_log /var/log/nginx/urida_timing.log urida_timing;
        error_log  /var/log/nginx/urida_error.log warn;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        location = /geoserver {
            return 301 /geoserver/;
        }

        # Keep public users away from GeoServer administration endpoints.
        # Replace 404 with allow/deny rules if an admin VPN path is required.
        location ^~ /geoserver/web/ {
            return 404;
        }

        location ^~ /geoserver/rest/ {
            return 404;
        }

        # Main app tile cache. The cache key includes auth state because
        # these routes are protected by verifyToken in the Node app. This
        # keeps the first phase safe. For cross-user shared cache, add
        # auth_request first, then remove the auth token from the cache key.
        location ~ ^/api/(wms-tile-cache|gwc-tiles)/ {
            proxy_pass http://urida_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_connect_timeout 10s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;

            proxy_buffering on;
            proxy_buffers 32 32k;
            proxy_busy_buffers_size 256k;

            proxy_cache urida_app_tile_cache;
            proxy_cache_key "$scheme$host$request_uri|$cookie_auth_token|$http_authorization";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_age 10s;
            proxy_cache_lock_timeout 15s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 60s;
            proxy_no_cache $skip_cache_method $skip_app_tile_cache_auth $upstream_http_set_cookie;
            proxy_cache_bypass $skip_cache_method $skip_app_tile_cache_auth;

            add_header X-Edge-Cache $upstream_cache_status always;
        }

        # Basemap and boundary-masked PNG cache. Still auth-keyed because the
        # route is protected, even though most source basemap pixels are public.
        location ^~ /api/tiles/ {
            proxy_pass http://urida_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_connect_timeout 10s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;

            proxy_buffering on;
            proxy_buffers 32 32k;
            proxy_busy_buffers_size 256k;

            proxy_cache urida_app_tile_cache;
            proxy_cache_key "$scheme$host$request_uri|$cookie_auth_token|$http_authorization";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_age 10s;
            proxy_cache_lock_timeout 15s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 1h;
            proxy_no_cache $skip_cache_method $skip_app_tile_cache_auth $upstream_http_set_cookie;
            proxy_cache_bypass $skip_cache_method $skip_app_tile_cache_auth;

            add_header X-Edge-Cache $upstream_cache_status always;
        }

        # Static boundary GeoJSON can be cached briefly, but keep it behind
        # the same auth-safe keying as the tile routes.
        location ^~ /api/boundary-geojson/ {
            proxy_pass http://urida_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_connect_timeout 10s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;

            proxy_buffering on;

            proxy_cache urida_app_tile_cache;
            proxy_cache_key "$scheme$host$request_uri|$cookie_auth_token|$http_authorization";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_age 10s;
            proxy_cache_lock_timeout 15s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 55m;
            proxy_no_cache $skip_cache_method $skip_app_tile_cache_auth $upstream_http_set_cookie;
            proxy_cache_bypass $skip_cache_method $skip_app_tile_cache_auth;

            add_header X-Edge-Cache $upstream_cache_status always;
        }

        # Direct GWC tiles are safe to cache only when they are GET/HEAD,
        # unauthenticated, and not carrying dynamic style/filter params.
        # Filtered road tiles should use /api/wms-tile-cache/ instead.
        location ^~ /geoserver/gwc/service/wms {
            proxy_pass http://urida_geoserver/geoserver/gwc/service/wms;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffers 32 32k;
            proxy_busy_buffers_size 256k;

            # GeoServer's own responses carry `Cache-Control: max-age=0,
            # must-revalidate` - without this, Nginx correctly defers to that
            # upstream header and never actually caches anything here
            # regardless of proxy_cache_valid below (confirmed live on LB2:
            # stayed MISS on every repeat request until this was added).
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache urida_geoserver_cache;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_age 10s;
            proxy_cache_lock_timeout 20s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 1h;
            proxy_no_cache $skip_cache_method $skip_geoserver_cache_auth $skip_geoserver_cache_dynamic;
            proxy_cache_bypass $skip_cache_method $skip_geoserver_cache_auth $skip_geoserver_cache_dynamic;

            add_header X-Edge-Cache $upstream_cache_status always;
            add_header Cache-Control "public, max-age=300" always;
        }

        # Metadata/legend calls are smaller and repeated by many users.
        # Keep TTL modest so catalog/style changes self-heal. WFS GetFeature
        # and WMS GetFeatureInfo intentionally bypass this cache.
        location /geoserver/ {
            proxy_pass http://urida_geoserver/geoserver/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffers 16 32k;
            proxy_busy_buffers_size 128k;

            # GeoServer's own responses carry `Cache-Control: max-age=0,
            # must-revalidate` - without this, Nginx correctly defers to that
            # upstream header and never actually caches anything here
            # regardless of proxy_cache_valid below (confirmed live on LB2:
            # stayed MISS on every repeat request until this was added).
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache urida_geoserver_cache;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_age 10s;
            proxy_cache_lock_timeout 20s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 10m;
            proxy_no_cache $skip_cache_method $skip_geoserver_cache_auth $skip_geoserver_cache_dynamic $skip_geoserver_metadata_cache_request;
            proxy_cache_bypass $skip_cache_method $skip_geoserver_cache_auth $skip_geoserver_cache_dynamic $skip_geoserver_metadata_cache_request;

            add_header X-Edge-Cache $upstream_cache_status always;
        }

        location /api/ {
            proxy_pass http://urida_app/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_connect_timeout 10s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;
        }

        location /static/ {
            proxy_pass http://urida_app/static/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://urida_app/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_connect_timeout 10s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;
        }
    }
}
